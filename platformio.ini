; PlatformIO Project Configuration File for Unified Workspace
; This configuration allows compiling ESP32 code directly from the root workspace.

[platformio]
# Redirect PlatformIO to find source files inside the esp32/ folder
src_dir = esp32/src
include_dir = esp32/include
lib_dir = esp32/lib

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Upload Port Configuration
upload_port = COM9

lib_deps =
    earlephilhower/ESP8266Audio @ ^1.9.7
    earlephilhower/ESP8266SAM @ ^1.0.1
    gilmaimon/ArduinoWebsockets @ ^0.5.3
    bblanchon/ArduinoJson @ ^6.21.3

